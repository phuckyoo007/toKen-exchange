name: Android build (signed AAB)

# Builds the signed Play Store bundle (.aab) from the files in this repo.
# Run it from the Actions tab: "Android build (signed AAB)" > Run workflow.
# Needs four repository secrets (Settings > Secrets and variables > Actions):
#   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD

on:
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Install Android platform and build tools
        run: |
          # The runner image already has the Android SDK (ANDROID_HOME).
          SDKM="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0"

      - name: Check required secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Repository secret $v is missing"; exit 1; fi
          done

      - name: Lay out the Android project
        run: |
          set -euo pipefail
          for f in AndroidManifest.xml MainActivity.java LocalAssetServer.java strings.xml build.gradle settings.gradle gradle.properties icon-512.png server.js package.json package-lock.json; do
            [ -f "$f" ] || { echo "::error::$f is missing from the repo root"; exit 1; }
          done
          mkdir -p scripts
          if [ ! -f scripts/prepare-android-assets.js ]; then cp prepare-android-assets.js scripts/prepare-android-assets.js; fi
          A=android
          rm -rf "$A"
          mkdir -p "$A/app/src/main/java/com/tokenexchange/wallet" "$A/app/src/main/res/values"
          cp settings.gradle gradle.properties "$A/"
          cp build.gradle "$A/app/build.gradle"
          cp AndroidManifest.xml "$A/app/src/main/AndroidManifest.xml"
          cp MainActivity.java LocalAssetServer.java "$A/app/src/main/java/com/tokenexchange/wallet/"
          cp strings.xml "$A/app/src/main/res/values/strings.xml"
          cat > "$A/build.gradle" <<'GRADLE'
          plugins {
              id "com.android.application" version "8.11.1" apply false
          }
          GRADLE
          # Launcher icons, made from the 512px app icon.
          for pair in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d="$A/app/src/main/res/mipmap-${pair%%:*}"
            mkdir -p "$d"
            convert icon-512.png -resize "${pair##*:}x${
