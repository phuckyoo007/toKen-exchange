name: Android build (signed AAB)

# Builds the signed Play Store bundle (.aab) from the files in this repo.
# Run it from the Actions tab: "Android build (signed AAB)" > Run workflow.
# Needs four repository secrets (Settings > Secrets and variables > Actions):
#   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD

on:
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Install Android platform and build tools
        run: |
          # The runner image already has the Android SDK (ANDROID_HOME).
          SDKM="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0"

      - name: Check required secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Repository secret $v is missing"; exit 1; fi
          done

      - name: Lay out the Android project
        run: |
          set -euo pipefail
          for f in AndroidManifest.xml MainActivity.java LocalAssetServer.java strings.xml build.gradle settings.gradle gradle.properties icon-512.png server.js package.json package-lock.json; do
            [ -f "$f" ] || { echo "::error::$f is missing from the repo root"; exit 1; }
          done
          mkdir -p scripts
          if [ ! -f scripts/prepare-android-assets.js ]; then cp prepare-android-assets.js scripts/prepare-android-assets.js; fi
          rm -rf android
          mkdir -p android/app/src/main/java/com/tokenexchange/wallet android/app/src/main/res/values
          cp settings.gradle gradle.properties android/
          cp build.gradle android/app/build.gradle
          cp AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp MainActivity.java LocalAssetServer.java android/app/src/main/java/com/tokenexchange/wallet/
          cp strings.xml android/app/src/main/res/values/strings.xml
          printf 'plugins {\n  id "com.android.application" version "8.11.1" apply false\n}\n' > android/build.gradle
          # Launcher icons, made from the 512px app icon.
          mkdir -p android/app/src/main/res/mipmap-mdpi android/app/src/main/res/mipmap-hdpi android/app/src/main/res/mipmap-xhdpi android/app/src/main/res/mipmap-xxhdpi android/app/src/main/res/mipmap-xxxhdpi
          convert icon-512.png -resize 48x48 android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert icon-512.png -resize 72x72 android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert icon-512.png -resize 96x96 android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert icon-512.png -resize 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert icon-512.png -resize 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Bundle the website into the app
        run: |
          npm ci
          node scripts/prepare-android-assets.js

      - name: Decode the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          test -s "$RUNNER_TEMP/release.keystore"

      - name: Build the release bundle
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon bundleRelease

      - name: Check the bundle is signed
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          ls -l "$AAB"
          jarsigner -verify "$AAB" | head -3
          keytool -printcert -jarfile "$AAB" | grep -E "SHA1|SHA256|Owner" | head -4
          cp "$AAB" TokenExchange-v2.1-code13.aab

      - uses: actions/upload-artifact@v4
        with:
          name: TokenExchange-v2.1-code13-aab
          path: TokenExchange-v2.1-code13.aab
          retention-days: 14
